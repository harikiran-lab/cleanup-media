name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test MediaCleanup.sln -c Release

      - name: Publish
        shell: pwsh
        run: ./scripts/publish.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: MediaCleanup-win-x64
          path: publish/
